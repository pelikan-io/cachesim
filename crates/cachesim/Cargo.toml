[package]
name = "cachesim-rs"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cache trace simulator for cache-rs crates, with libCacheSim-compatible trace formats"

[[bin]]
name = "cachesim"
path = "src/main.rs"

[lib]
name = "cachesim"
path = "src/lib.rs"

[dependencies]
arrow.workspace = true
cachetrace = { path = "../cachetrace", version = "0.1.0", features = ["import"] }
clap = { version = "4", features = ["derive"] }
cuckoo-cache = { version = "0.2.0", default-features = false }
parquet.workspace = true
segcache = { version = "0.4.4", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
default = ["hf-fetch"]
# `--model <repo id>`: fetch a model config.json from Hugging Face.
hf-fetch = ["dep:ureq"]

[dev-dependencies]
tempfile.workspace = true
