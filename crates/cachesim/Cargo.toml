[package]
name = "cachesim-rs"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Cache trace simulator for cache-rs crates, with libCacheSim-compatible trace formats"

[[bin]]
name = "cachesim"
path = "src/main.rs"

[lib]
name = "cachesim"
path = "src/lib.rs"

[dependencies]
arrow.workspace = true
cachetrace = { path = "../cachetrace", version = "0.1.0", features = ["import"] }
clap = { version = "4", features = ["derive"] }
cuckoo-cache = { version = "0.2.0", default-features = false }
kvtrace = { path = "../kvtrace", version = "0.1.0", default-features = false }
parquet.workspace = true
# `cachesim gen`: the seeded zipf stream (ChaCha8 + rand_distr Zipf).
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10"
rand_distr = "0.6"
segcache = { version = "0.4.4", default-features = false }
thiserror.workspace = true

[features]
default = ["hf-fetch"]
# `--model <repo id>`: fetch a model config.json from Hugging Face.
hf-fetch = ["kvtrace/hf-fetch"]

[dev-dependencies]
tempfile.workspace = true
