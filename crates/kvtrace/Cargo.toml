[package]
name = "kvtrace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Request-level KV-cache traces for LLM serving: Parquet format, model geometry, and the request-to-object mapping"

[dependencies]
arrow.workspace = true
parquet.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
default = ["hf-fetch"]
# hf::fetch_config: download a model config.json from Hugging Face.
hf-fetch = ["dep:ureq"]

[dev-dependencies]
tempfile.workspace = true
