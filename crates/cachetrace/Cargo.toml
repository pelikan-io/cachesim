[package]
name = "cachetrace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Object-level cache trace format: libCacheSim-compatible Parquet schema, reader, writer and importers"

[dependencies]
ahash = { workspace = true, optional = true }
arrow.workspace = true
parquet.workspace = true
thiserror.workspace = true
zstd = { workspace = true, optional = true }

[features]
default = ["import"]
# Importers for libCacheSim oracleGeneral/oracleGeneralOpNs binaries and
# pelikan-io/cache-trace CSV. Without it the crate is the Parquet schema,
# TraceEntry, Op, TraceReader and TraceWriter only.
import = ["dep:ahash", "dep:zstd"]

[dev-dependencies]
tempfile.workspace = true
