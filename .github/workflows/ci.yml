name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Test (no default features)
        run: cargo test --workspace --no-default-features

      # The reader/writer core alone, as a dependent with
      # default-features = false gets it. Building in the workspace would
      # turn the feature back on through cachesim.
      - name: Test cachetrace core (no importers)
        run: cargo test -p cachetrace --no-default-features

      # kvtrace as a load generator depends on it: no HTTP client.
      - name: Test kvtrace without hf-fetch
        run: cargo test -p kvtrace --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Clippy cachetrace core (no importers)
        run: cargo clippy -p cachetrace --all-targets --no-default-features -- -D warnings

      - name: Clippy kvtrace without hf-fetch
        run: cargo clippy -p kvtrace --all-targets --no-default-features -- -D warnings

      - name: cachetrace core has no importer dependencies
        shell: bash
        run: |
          deps=$(cargo tree -p cachetrace --no-default-features -e normal --depth 1 --prefix none)
          echo "$deps"
          if echo "$deps" | grep -E '^(ahash|zstd) '; then
            echo "cachetrace without the import feature depends on an importer crate" >&2
            exit 1
          fi

      - name: kvtrace depends on neither cachetrace nor an HTTP client
        shell: bash
        run: |
          deps=$(cargo tree -p kvtrace --no-default-features -e normal --prefix none)
          if echo "$deps" | grep -E '^(cachetrace|ureq) '; then
            echo "kvtrace without hf-fetch depends on cachetrace or ureq" >&2
            exit 1
          fi
          if cargo tree -p kvtrace -e normal --prefix none | grep -E '^cachetrace '; then
            echo "kvtrace depends on cachetrace" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all --check

      - name: Packages include README and LICENSE
        shell: bash
        run: |
          for p in cachetrace cachesim-rs; do
            files=$(cargo package --list -p "$p" --allow-dirty)
            for f in README.md LICENSE; do
              echo "$files" | grep -qx "$f" || { echo "$p package lacks $f" >&2; exit 1; }
            done
          done
