[workspace]
members = ["crates/cachetrace", "crates/kvtrace", "crates/cachesim"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pelikan-io/cachesim"

[workspace.dependencies]
ahash = "0.8"
arrow = { version = "58", default-features = false, features = ["prettyprint"] }
parquet = { version = "58", default-features = false, features = ["arrow", "snap", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
