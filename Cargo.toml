[package]
name = "cachesim-rs"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Cache trace simulator for cache-rs crates, with libCacheSim-compatible trace formats"
repository = "https://github.com/pelikan-io/cachesim"

[[bin]]
name = "cachesim"
path = "src/main.rs"

[lib]
name = "cachesim"
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
arrow = { version = "58", default-features = false, features = ["prettyprint"] }
clap = { version = "4", features = ["derive"] }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
cuckoo-cache = { version = "0.2.0", default-features = false }
segcache = { version = "0.4.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
thiserror = "2"
zstd = "0.13"

[features]
default = ["hf-fetch"]
# `--model <repo id>`: fetch a model config.json from Hugging Face.
hf-fetch = ["dep:ureq"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
